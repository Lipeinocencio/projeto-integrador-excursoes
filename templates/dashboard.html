<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Viagens - CaroliExcursões</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .navbar { background-color: #2c3e50; margin-bottom: 30px; }
        .card-viagem { transition: transform 0.3s; border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card-viagem:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .preco-tag { color: #27ae60; font-weight: bold; font-size: 1.2rem; }
        .welcome-section { padding: 40px 0; background: white; margin-bottom: 30px; border-bottom: 1px solid #dee2e6; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">CaroliExcursões</a>
        <div class="ms-auto">
            <span class="text-white me-3">Olá, <strong>{{ session['usuario_nome'] }}</strong>!</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col text-center">
            <h2 class="fw-bold">Escolha sua próxima aventura</h2>
            <p class="text-muted">As melhores experiências selecionadas para você.</p>
        </div>
    </div>

    <div class="row">
        {% for v in lista %}
        <div class="col-md-4 mb-4">
            <div class="card card-viagem h-100">
                <div class="card-body p-4 text-center">
                    <div class="mb-2 text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-geo-alt-fill" viewBox="0 0 16 16">
                            <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10m0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6"/>
                        </svg>
                    </div>
                    <h5 class="card-title fw-bold text-uppercase">{{ v[1] }}</h5>
                    <p class="card-text text-muted small">Data: {{ v[2] }}</p>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="preco-tag">R$ {{ v[4] }}</span>
                        <a href="/comprar/{{ v[0] }}" class="btn btn-success px-4 rounded-pill">Comprar</a>
                    </div>
                    <p class="mt-2 text-secondary x-small" style="font-size: 0.8rem;">{{ v[3] }} vagas restantes</p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>

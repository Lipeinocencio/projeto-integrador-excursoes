<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - PI Excursões</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header-admin { background-color: #2c3e50; color: white; padding: 20px 0; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="header-admin text-center">
    <h1>Painel de Controle - PI Excursões</h1>
    <p>Gerenciamento de Excursões e Destinos</p>
</div>

<div class="container">
    <div class="row">
        <div class="col-md-4">
            <div class="card p-4">
                <h4 class="mb-4">Nova Excursão</h4>
                <!-- Adicionado o enctype="multipart/form-data" para permitir envio de arquivos -->
                <form action="/cadastrar" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Destino</label>
                        <input type="text" name="destino" class="form-control" placeholder="Ex: Rio de Janeiro" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data</label>
                        <input type="text" name="data" class="form-control" placeholder="Ex: 20/12/2026" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vagas</label>
                        <input type="number" name="vagas" class="form-control" placeholder="Quantidade" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preço (R$)</label>
                        <input type="number" step="0.01" name="preco" class="form-control" placeholder="150.00" required>
                    </div>
                    <!-- Novo campo de Imagem -->
                    <div class="mb-3">
                        <label class="form-label">Imagem da Excursão</label>
                        <input type="file" name="imagem" class="form-control" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Lançar Viagem</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card p-4">
                <h4 class="mb-4">Excursões Ativas</h4>
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Foto</th> <!-- Nova coluna -->
                            <th>Destino</th>
                            <th>Data</th>
                            <th>Vagas</th>
                            <th>Preço</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for v in lista %}
                        <tr>
                            <!-- Renderização da miniatura da foto -->
                            <td>
                                {% if v[5] %}
                                    <img src="{{ url_for('static', filename='uploads/' + v[5]) }}" alt="Destino" style="width: 60px; height: 45px; object-fit: cover; border-radius: 4px;">
                                {% else %}
                                    <span class="text-muted small">Sem foto</span>
                                {% endif %}
                            </td>
                            <td><strong>{{ v[1] }}</strong></td>
                            <td>{{ v[2] }}</td>
                            <td>{{ v[3] }}</td>
                            <td>R$ {{ v[4] }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="mt-3">
                <a href="/login" class="text-muted">Ir para tela de Login do Cliente</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
